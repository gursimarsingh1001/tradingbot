services:
  postgres:
    image: postgres:15
    container_name: trading-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: trading-bot-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: trading-bot
      DOCKER_INFLUXDB_INIT_BUCKET: market-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: influx-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7
    container_name: trading-bot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: trading-bot-backend-local
    container_name: trading-bot-backend
    restart: unless-stopped
    working_dir: /app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      ANGEL_ONE_API_KEY: ${ANGEL_ONE_API_KEY}
      ANGEL_ONE_CLIENT_ID: ${ANGEL_ONE_CLIENT_ID}
      ANGEL_ONE_PASSWORD: ${ANGEL_ONE_PASSWORD}
      ANGEL_ONE_TOTP_SECRET: ${ANGEL_ONE_TOTP_SECRET}
      NEWS_API_KEY: ${NEWS_API_KEY}
      POSTGRES_URL: postgresql+psycopg://trading_user:trading_password@postgres:5432/trading_bot
      REDIS_URL: redis://redis:6379/0
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: influx-token
      INFLUX_ORG: trading-bot
      INFLUX_BUCKET: market-data
      SYMBOLS_CONFIG_PATH: /app/backend/config/nifty500_symbols.json
      PAPER_PORTFOLIO_VALUE: 1000000
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  influxdb-data:
  influxdb-config:
  redis-data:
